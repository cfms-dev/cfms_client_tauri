[workspace]
members = [
    "src-tauri",
    "crates/core",
    "crates/crypto",
    "crates/transport",
    "crates/transfer",
    "crates/service",
]
resolver = "2"

# Keep production KDF parameters in tests while optimizing their hot path.
# The rest of the workspace retains the normal debuggable test profile.
[profile.test.package.cfms-crypto]
opt-level = 2

[profile.test.package.pbkdf2]
opt-level = 2

[profile.test.package.sha2]
opt-level = 2

[profile.test.package.hmac]
opt-level = 2

[profile.test.package.digest]
opt-level = 2

[workspace.package]
version = "0.60.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/cfms-dev/cfms_client_tauri"

[workspace.dependencies]
# ---------------------------------------------------------------------------
# Internal crates
# ---------------------------------------------------------------------------
cfms-core = { path = "crates/core" }
cfms-crypto = { path = "crates/crypto" }
cfms-transport = { path = "crates/transport" }
cfms-transfer = { path = "crates/transfer" }
cfms-service = { path = "crates/service" }

# ---------------------------------------------------------------------------
# Serialization
# ---------------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"

# ---------------------------------------------------------------------------
# Error handling
# ---------------------------------------------------------------------------
thiserror = "2"

# ---------------------------------------------------------------------------
# Cryptography
# ---------------------------------------------------------------------------
aes-gcm = "0.11"
pbkdf2 = "0.13"
sha2 = "0.11"
hmac = "0.13"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64ct = { version = "1", features = ["alloc"] }
ed25519-dalek = "3"

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
rusqlite = { version = "0.41", features = ["bundled"] }
memmap2 = "0.9"
tempfile = "3"

# ---------------------------------------------------------------------------
# Async runtime & networking
# ---------------------------------------------------------------------------
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
rustls = "0.23"
rustls-webpki = { version = "0.103.16", features = ["aws-lc-rs"] }
x509-parser = { version = "0.18", features = ["verify-aws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
ipnet = "2"
webpki-roots = "1"
tokio-socks = "0.5"
tokio-rustls = "0.26"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "socks"] }
tracing = { version = "0.1", features = ["log"] }
url = "2"
dashmap = "6"
fluent-bundle = "0.16"
unic-langid = "0.9"

# ---------------------------------------------------------------------------
# Tauri
# ---------------------------------------------------------------------------
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-background-service = "1.0"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
async-trait = "0.1"
