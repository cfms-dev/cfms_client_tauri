name: CI

# Runs on every push and PR to main.
# Fast checks: Rust tests, clippy, frontend type-check, and format validation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    name: Rust tests, Clippy and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Disable Tauri's custom-protocol feature so Rust checks do not require frontend assets.
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --no-default-features --locked -- --test-threads=4

  # ---------------------------------------------------------------------------
  # Frontend — type-check & build
  # ---------------------------------------------------------------------------
  frontend-checks:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24
      
      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - name: Client version metadata check
        run: pnpm app:version:check

      - name: Release notes generation check
        run: pnpm app:release-notes

      - name: SvelteKit sync + type-check
        run: pnpm check

      - name: Frontend behavior tests
        run: pnpm test

      - name: Frontend order independence (fixed seed)
        run: pnpm test:shuffle

      - name: Script behavior tests
        run: pnpm test:scripts

      - name: Python validator tests
        run: pnpm test:python

      - name: Translation usage
        run: pnpm i18n:unused

      - name: Production build
        run: pnpm build

      - name: Validate release security configuration
        run: >-
          python scripts/validate-release-security.py
          --frontend-dist build
          --android-manifest src-tauri/gen/android/app/src/main/AndroidManifest.xml
